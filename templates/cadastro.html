<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../styles/css/cadastro.css">
</head>
<body>
    <div class="container">

    <div class="left">
        <h1>
            Faça o seu
            <span>cadastro</span>
        </h1>
        <div class="urso">
            <img src="../styles/img/urso.png" alt="Urso">
        </div>
    </div>

    <div class="right">

        <form class="form-box">

            <div class="input-group">
                <input type="email" placeholder="Email">
            </div>

            <div class="input-group">
                <input type="text" placeholder="Username">
            </div>

            <div class="input-group">
                <input type="password" placeholder="Password">
            </div>

            <button class="btn-cadastro" onclick="window.location.href='../templates/login.html'">
                Cadastrar →
            </button>

        </form>

    </div>

</div>
</body>
</html>
