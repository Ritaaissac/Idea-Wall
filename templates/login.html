<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="../styles/css/login.css">
</head>

<body>

<div class="container">

    <div class="left">

        <h1>
            Faça o seu
            <span class="texto2">login</span>
        </h1>

        <div class="urso">
            <img src="../styles/img/urso.png" alt="urso">
        </div>

    </div>

    <div class="right">

        <form class="form-box" id="loginForm">

            <div class="input-group">
                <input
                    id="email"
                    type="email"
                    placeholder="Email"
                    required
                >
            </div>

            <div class="input-group">
                <input
                    id="senha"
                    type="password"
                    placeholder="Senha"
                    required
                >
            </div>

            <div
                class="cadastro"
                onclick="window.location.href='../templates/cadastro.html'"
            >
                <a href="#">Ainda não está cadastrado?</a>
            </div>

            <button class="btn-login" type="submit">
                Login →
            </button>

        </form>

    </div>

</div>

<script src="../static/js/login.js"></script>

</body>
</html>
